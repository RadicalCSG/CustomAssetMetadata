name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode:
    # Needs the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets, and the repository variable
    # UNITY_TESTS set to true; until then, and for pull requests from forks, the job shows as skipped.
    if: >-
      vars.UNITY_TESTS == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: .
          unityVersion: 6000.3.18f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
