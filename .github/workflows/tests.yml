name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      # Forks and repositories without a Unity license cannot run Unity
      - name: Check for a Unity license
        id: license
        run: echo "present=${{ env.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip without a license
        if: steps.license.outputs.present != 'true'
        run: echo "::notice::The UNITY_LICENSE secret is not set, so the tests did not run"

      - uses: actions/checkout@v4
        if: steps.license.outputs.present == 'true'

      - uses: game-ci/unity-test-runner@v4
        if: steps.license.outputs.present == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: .
          unityVersion: 6000.3.18f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
